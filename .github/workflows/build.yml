name: Office add-ins

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  office-addins:
    name: Build, code tests and isolated installer gates
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and verify PowerPoint and Visio add-ins
        shell: pwsh
        run: ./verify-code.ps1